# Collection history: exports Supabase into per-set CSV snapshots daily.
# Git history makes each snapshot diffable — you can see exactly which
# cards were added between any two weeks, and restore any past state.
name: Backup Supabase collection

on:
  schedule:
    - cron: "0 9 * * *"     # every day at 09:00 UTC
  workflow_dispatch:         # and on demand from the Actions tab

permissions:
  contents: read

concurrency:
  group: backup-main
  cancel-in-progress: false

jobs:
  backup:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Export Supabase collection
        run: python scripts/backup_supabase.py
      - name: Synchronize image manifests
        shell: bash
        run: |
          for manifest in public/img/*/manifest.txt; do
            set_id="$(basename "$(dirname "$manifest")")"
            sheet="backups/$set_id.csv"
            if [[ -f "$sheet" ]]; then
              python scripts/sync_manifest.py "$sheet" "$set_id"
            fi
          done
      - name: Validate collection backups and image manifests
        run: python scripts/validate_data.py
      - name: Commit and open protected update PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "collection-backup[bot]"
          git config user.email "actions@github.com"
          git add backups/ public/img/*/manifest.txt
          if git diff --cached --quiet; then
            echo "No changes since last backup"
          else
            git commit -m "chore(data): refresh collection backups"
            branch="automation/collection-backup"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
            git push origin "HEAD:refs/heads/$branch" --force-with-lease
            pr_url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url')"
            if [[ -z "$pr_url" ]]; then
              pr_url="$(gh pr create --base main --head "$branch" \
                --title "chore(data): refresh collection backups" \
                --body "Automated recovery snapshots and synchronized image manifests.")"
            fi
            gh pr merge "$pr_url" --auto --squash
          fi
