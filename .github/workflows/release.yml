# Creates SemVer GitHub Releases from Conventional Commits after production CI succeeds.
name: Release

on:
  workflow_run:
    workflows: ["Tests / Security / Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Calculate the version from the exact commit that passed and was
          # deployed, even if main advances before this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Calculate SemVer release
        id: semver
        run: node scripts/release.mjs

      - name: Prepare changelog entry
        if: steps.semver.outputs.release == 'true'
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          NOTES: ${{ steps.semver.outputs.notes }}
        run: |
          node scripts/changelog.mjs
          cp CHANGELOG.md /tmp/release-CHANGELOG.md

      - name: Prepare release asset directory
        if: steps.semver.outputs.release == 'true'
        run: mkdir -p release-artifact

      - name: Download deployed Pages artifact
        if: steps.semver.outputs.release == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$SOURCE_RUN_ID" --name github-pages --dir release-artifact
          sha256sum release-artifact/artifact.tar > release-artifact/artifact.tar.sha256

      - name: Generate SPDX software bill of materials
        if: steps.semver.outputs.release == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifact/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest deployed Pages artifact
        if: steps.semver.outputs.release == 'true' && github.event_name == 'workflow_run'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-artifact/artifact.tar

      - name: Create tag and GitHub Release
        id: publish
        if: steps.semver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          NOTES: ${{ steps.semver.outputs.notes }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SITE_URL: https://tinyspice123.github.io/ultimate_pokemon_card_tracker/
        run: |
          set -euo pipefail
          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release $NEXT_TAG already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf '%s\n\n' "$NOTES"
            echo "### Deployment provenance"
            echo
            echo "- Deployed commit: \`$TARGET_SHA\`"
            echo "- Production: $SITE_URL"
            if [[ -n "$SOURCE_RUN_ID" ]]; then
              echo "- Validated pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
            fi
            echo "- Quality gates: site, unit, Python, browser, and SonarQube checks passed"
            if [[ -f release-artifact/artifact.tar.sha256 ]]; then
              echo "- Artifact checksum: \`$(cut -d' ' -f1 release-artifact/artifact.tar.sha256)\` (SHA-256)"
            fi
          } > release-notes.md
          gh release create "$NEXT_TAG" \
            --title "$NEXT_TAG" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attach deployed artifact to release
        if: steps.publish.outputs.created == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
        run: |
          gh release upload "$NEXT_TAG" \
            'release-artifact/artifact.tar#deployed-pages.tar' \
            'release-artifact/artifact.tar.sha256#deployed-pages.tar.sha256' \
            'release-artifact/sbom.spdx.json#sbom.spdx.json'

      - name: Publish generated changelog
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B changelog-update origin/main
          cp /tmp/release-CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "release[bot]"
          git config user.email "actions@github.com"
          git commit -m "docs: update changelog for $NEXT_TAG"
          branch="automation/changelog-${NEXT_TAG}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "docs: update changelog for $NEXT_TAG" \
            --body "Generated from the Conventional Commits included in $NEXT_TAG.")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          gh workflow run ci-quality-deploy.yml --ref "$branch" \
            -f pull_request_number="$pr_number" -f head_ref="$branch" -f base_ref=main
          gh workflow run security.yml --ref "$branch" \
            -f head_ref="$branch" -f base_ref=main
          gh pr merge "$pr_url" --auto --squash
