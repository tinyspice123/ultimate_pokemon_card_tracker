# Creates SemVer GitHub Releases from Conventional Commits after production CI succeeds.
name: Release

on:
  workflow_run:
    workflows: ["Tests / Security / Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main Tests / Security / Deploy run ID to release
        required: true
        type: string

permissions:
  actions: write
  attestations: write
  checks: read
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      created: ${{ steps.publish.outputs.created }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      target_sha: ${{ steps.publish.outputs.target_sha }}
      changelog_pr: ${{ steps.changelog.outputs.pr_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the successful deployed run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          [[ "$(jq -r .name <<< "$run")" == "Tests / Security / Deploy" ]]
          [[ "$(jq -r .conclusion <<< "$run")" == success ]]
          [[ "$(jq -r .head_branch <<< "$run")" == main ]]
          target_sha="$(jq -r .head_sha <<< "$run")"
          git checkout --detach "$target_sha"
          printf 'run_id=%s\ntarget_sha=%s\n' "$SOURCE_RUN_ID" "$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Wait for post-merge security scanning
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            checks="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"
            js="$(jq -r '.check_runs[] | select(.name == "CodeQL (javascript-typescript)") | .conclusion // empty' <<< "$checks" | tail -n1)"
            py="$(jq -r '.check_runs[] | select(.name == "CodeQL (python)") | .conclusion // empty' <<< "$checks" | tail -n1)"
            if [[ "$js" == success && "$py" == success ]]; then
              break
            fi
            if [[ "$js" =~ ^(failure|cancelled|timed_out|action_required)$ ||
                  "$py" =~ ^(failure|cancelled|timed_out|action_required)$ ]]; then
              echo "Post-merge security scanning failed: javascript=$js python=$py" >&2
              exit 1
            fi
            if (( attempt == 40 )); then
              echo "Timed out waiting for post-merge security scanning" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Calculate SemVer release
        id: semver
        run: node scripts/release.mjs

      - name: Rebuild changelog from release tags
        if: steps.semver.outputs.release == 'true'
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          NOTES: ${{ steps.semver.outputs.notes }}
        run: |
          node scripts/changelog.mjs
          cp CHANGELOG.md /tmp/release-CHANGELOG.md

      - name: Prepare release asset directory
        if: steps.semver.outputs.release == 'true'
        run: mkdir -p release-artifact

      - name: Download deployed Pages artifact
        if: steps.semver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          gh run download "$SOURCE_RUN_ID" --name github-pages --dir release-artifact
          sha256sum release-artifact/artifact.tar > release-artifact/artifact.tar.sha256

      - name: Generate SPDX software bill of materials
        if: steps.semver.outputs.release == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifact/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest deployed Pages artifact
        if: steps.semver.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifact/artifact.tar

      - name: Create tag and GitHub Release
        id: publish
        if: steps.semver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          NOTES: ${{ steps.semver.outputs.notes }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SITE_URL: https://tinyspice123.github.io/ultimate_pokemon_card_tracker/
        run: |
          set -euo pipefail
          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release $NEXT_TAG already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf '%s\n\n' "$NOTES"
            echo "### Deployment provenance"
            echo
            echo "- Deployed commit: \`$TARGET_SHA\`"
            echo "- Production: $SITE_URL"
            if [[ -n "$SOURCE_RUN_ID" ]]; then
              echo "- Validated pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
            fi
            echo "- Quality gates: site, unit, Python, browser, and SonarQube checks passed"
            if [[ -f release-artifact/artifact.tar.sha256 ]]; then
              echo "- Artifact checksum: \`$(cut -d' ' -f1 release-artifact/artifact.tar.sha256)\` (SHA-256)"
            fi
          } > release-notes.md
          gh release create "$NEXT_TAG" \
            --title "$NEXT_TAG" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Attach deployed artifact to release
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
        run: |
          mv release-artifact/artifact.tar release-artifact/deployed-pages.tar
          (cd release-artifact && sha256sum deployed-pages.tar > deployed-pages.tar.sha256)
          rm release-artifact/artifact.tar.sha256
          gh release upload "$NEXT_TAG" \
            release-artifact/deployed-pages.tar \
            release-artifact/deployed-pages.tar.sha256 \
            release-artifact/sbom.spdx.json

      - name: Publish generated changelog
        id: changelog
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          NOTES: ${{ steps.semver.outputs.notes }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B changelog-update origin/main
          node scripts/changelog.mjs
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "release[bot]"
          git config user.email "actions@github.com"
          git commit -m "docs: update changelog for $NEXT_TAG"
          AUTOMATION_BRANCH=automation/release-changelog \
          PR_TITLE="docs: update changelog through $NEXT_TAG" \
          PR_BODY="Rebuilt from all SemVer tags through $NEXT_TAG." \
            bash scripts/upsert_generated_pr.sh

  verify-release:
    name: Verify published release
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.next_tag }}
      TARGET_SHA: ${{ needs.release.outputs.target_sha }}
      CHANGELOG_PR: ${{ needs.release.outputs.changelog_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.target_sha }}
      - name: Verify tag, assets, checksum, attestation, and changelog PR
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ "$(git rev-list -n1 "$TAG")" == "$TARGET_SHA" ]]
          mkdir release-verification
          gh release download "$TAG" --dir release-verification
          for asset in deployed-pages.tar deployed-pages.tar.sha256 sbom.spdx.json; do
            [[ -s "release-verification/$asset" ]]
          done
          (
            cd release-verification
            sed -i 's#release-artifact/artifact.tar#deployed-pages.tar#' deployed-pages.tar.sha256
            sha256sum --check deployed-pages.tar.sha256
          )
          gh attestation verify release-verification/deployed-pages.tar --repo "$GITHUB_REPOSITORY"
          [[ -n "$CHANGELOG_PR" ]]
          [[ "$(gh pr view "$CHANGELOG_PR" --json headRefName --jq .headRefName)" == automation/release-changelog ]]
