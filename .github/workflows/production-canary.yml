name: Production dependency canary

on:
  schedule:
    - cron: "30 10 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-site:
    name: Production browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/production/
            /package-lock.json
            /package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install browser test tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the deployed application
        env:
          SITE_URL: https://tinyspice123.github.io/ultimate_pokemon_card_tracker/
        run: node tests/production/smoke.mjs

  supabase-api:
    name: Supabase catalogue API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/supabase-config.js
            /scripts/backup_supabase.py
            /scripts/sets_js.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Verify the public catalogue API
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from backup_supabase import fetch_set, parse_supabase_config

          url, key = parse_supabase_config(Path('public/supabase-config.js').read_text())
          rows = fetch_set(url, key, 'stellar-crown')
          if not rows:
              raise SystemExit('Supabase returned no Stellar Crown cards')
          print(f'Supabase catalogue is reachable: {len(rows)} Stellar Crown cards')
          PY

  check-logos:
    name: Set logo reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/sets.js
            /scripts/check_logos.py
            /scripts/sets_js.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check every set's logo resolves
        run: python scripts/check_logos.py

  backup-recovery:
    name: Backup recovery drill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backups/
            /scripts/recovery_drill.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Restore every backup into an isolated database
        run: python scripts/recovery_drill.py backups

  notify:
    name: Report canary status
    if: always()
    needs: [deployed-site, supabase-api, check-logos, backup-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Production canary failure"
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Open, update, or resolve the canary incident
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          failed_jobs="$(jq -r 'to_entries[] | select(.value.result != "success") | "- \(.key): \(.value.result)"' <<< "$NEEDS_JSON")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$failed_jobs" ]]; then
            {
              echo "The scheduled production canary detected a failure."
              echo
              echo "$failed_jobs"
              echo
              echo "Run: $run_url"
            } > /tmp/canary-issue.md
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --body-file /tmp/canary-issue.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/canary-issue.md
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --comment "Production canary recovered: $run_url"
          fi
