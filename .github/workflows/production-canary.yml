name: Production dependency canary

on:
  schedule:
    - cron: "30 10 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-site:
    name: Production browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/production/
            /package-lock.json
            /package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser test tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the deployed application
        env:
          SITE_URL: https://tinyspice123.github.io/ultimate_pokemon_card_tracker/
        run: node tests/production/smoke.mjs

  supabase-api:
    name: Supabase catalogue API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/supabase-config.js
            /scripts/backup_supabase.py
            /scripts/sets_js.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Verify the public catalogue API
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from backup_supabase import fetch_set, parse_supabase_config

          url, key = parse_supabase_config(Path('public/supabase-config.js').read_text())
          rows = fetch_set(url, key, 'stellar-crown')
          if not rows:
              raise SystemExit('Supabase returned no Stellar Crown cards')
          print(f'Supabase catalogue is reachable: {len(rows)} Stellar Crown cards')
          PY

  check-logos:
    name: Set logo reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/sets.js
            /scripts/check_logos.py
            /scripts/sets_js.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check every set's logo resolves
        run: python scripts/check_logos.py
