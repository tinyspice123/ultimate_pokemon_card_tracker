name: Bug report
description: Report a reproducible problem in the tracker or its automation
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use the Security tab.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the set, card/filter, URL, and smallest reliable steps.
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/device, or workflow run URL for automation failures.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Sanitized screenshots, console output, or logs. Never paste secrets.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true

